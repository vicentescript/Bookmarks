<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOKMARKS</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" sizes="64x64" href="assets/images/favicon.png">
  <script type="module" src="/js/app.js"></script>
</head>

<body>
  <div class="parent">
    <header>
      <div class="logo-container">
        <img src="assets/images/favicon.png" alt="Logo Bookmarks" class="header-icon">
        <span>BOOKMARKS</span>
      </div>
    </header>

    <section class="hero">
      <div class="hero-image-container">
        <img src="assets/images/hero.jpg" alt="Persona leyendo un libro" class="hero-img">
      </div>

      <div class="hero-content">
        <div class="info-hero">
          <p>Track the pages</p>
          <p><em>Keep the <span style="color: #ffbd59;">memories</span></em></p>
          <p><strong>Quantify your curiosity</strong></p>
        </div>
        <div class="hero-reading" id="currentlyReading"></div>
      </div>
    </section>

    <section class="seccion-busqueda">
      <div class="busqueda-container">
        <img src="assets/images/favicon.png" alt="" class="section-icon">
        <input type="text" id="searchInput" placeholder="Buscar libros por título, autor...">
      </div>
      <div class="resultados-busqueda"></div>
    </section>

    <section class="seccion-biblioteca">
      <div class="biblioteca-header">
        <h2>Mi biblioteca</h2>
        <div class="filtros-estados" id="filtrosEstados"></div>
      </div>
      <div class="mis-libros"></div>
    </section>

    <footer>Pie de página</footer>
  </div>
</body>

</html>
