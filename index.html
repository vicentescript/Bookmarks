<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffbd59">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BOOKMARKS">
  <link rel="manifest" href="manifest.json">
  <title>BOOKMARKS</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" sizes="64x64" href="assets/images/favicon.png">
  <script type="module" src="js/app.js"></script>
</head>

<body>
  <div class="parent">
    <header>
      <div class="logo-container">
        <img src="assets/images/favicon.png" alt="Logo Bookmarks" class="header-icon">
        <span>BOOKMARKS</span>
      </div>
      <div class="header-search">
        <div class="search-wrapper">
          <input type="text" id="searchInput" placeholder="Buscar libros...">
          <span class="search-shortcut">Ctrl+K</span>
        </div>
      </div>
    </header>

    <section class="hero">
      <div class="hero-image-container">
        <img src="assets/images/hero.jpg" alt="Persona leyendo un libro" class="hero-img">
      </div>

      <div class="hero-content">
        <div class="info-hero">
          <p>Track the pages</p>
          <p><em>Keep the <span style="color: #ffbd59;">memories</span></em></p>
          <p><strong>Quantify your curiosity</strong></p>
        </div>
        <div class="hero-reading" id="currentlyReading"></div>
      </div>
    </section>

    <section class="seccion-busqueda" style="display:none"></section>

    <section class="seccion-biblioteca">
      <div class="biblioteca-header">
        <div class="logo-container">
          <img src="assets/images/favicon.png" alt="Logo Bookmarks" class="header-icon">
          <h2>Mi biblioteca</h2>
          <button class="add-manual-btn" id="addManualBtn">+ Añadir</button>
        </div>
        <div class="biblioteca-tools">
          <input type="text" id="librarySearch" placeholder="Filtrar por título o autor..." class="library-search">
          <div class="filtros-estados" id="filtrosEstados"></div>
        </div>
      </div>
      <div class="mis-libros"></div>
    </section>

    <footer>
      <span class="footer-left">
        <span class="footer-brand">BOOKMARKS</span>
        <span class="footer-sep">·</span>
        <span class="footer-desc">Track the pages · Keep the memories · Quantify your curiosity</span>
      </span>
      <span class="footer-right">
        <a href="https://github.com/vicentescript" target="_blank" class="footer-link">github</a>
        <span class="footer-sep">·</span>
        <a href="mailto:vicentescript@gmail.com" class="footer-link">vicentescript@gmail.com</a>
        <span class="footer-sep">·</span>
        <span class="footer-year">2026</span>
      </span>
    </footer>
  </div>
</body>

</html>
